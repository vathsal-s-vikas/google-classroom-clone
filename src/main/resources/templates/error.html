<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        .error-template {
            padding: 40px 15px;
            text-align: center;
        }
        .error-details {
            text-align: left;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .error-actions {
            margin-top: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="error-template">
                    <h1>Oops!</h1>
                    <h2 th:text="${status + ' - ' + error}">Error Occurred</h2>
                    <div class="error-details">
                        <p><strong>Message:</strong> <span th:text="${message}">Error Message</span></p>
                        <p><strong>Path:</strong> <span th:text="${path}">Error Path</span></p>
                        <p><strong>Timestamp:</strong> <span th:text="${timestamp}">Error Timestamp</span></p>
                    </div>
                    <div class="error-actions">
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house"></i> Back to Home
                        </a>
                        <a href="javascript:history.back()" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Go Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
