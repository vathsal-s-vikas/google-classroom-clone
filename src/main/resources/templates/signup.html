<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup Form</title>
    <!-- CSRF tokens for security -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-image: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(3px);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        section {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .inputbox {
            position: relative;
            margin-bottom: 20px;
        }

        .inputbox ion-icon {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #888;
        }

        .inputbox input,
        .inputbox select {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        .inputbox label {
            position: absolute;
            top: -10px;
            left: 35px;
            font-size: 12px;
            background-color: white;
            padding: 0 5px;
            color: #666;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        .register {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .register a {
            color: #4CAF50;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<section>
    <form id="signupForm">
        <h1>Sign Up</h1>

        <div class="inputbox">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" id="name" name="name" required>
            <label for="name">Name</label>
        </div>

        <div class="inputbox">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="email" id="email" name="email" required>
            <label for="email">Email</label>
        </div>

        <div class="inputbox">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" id="password" name="password" required>
            <label for="password">Password</label>
        </div>

        <div class="inputbox">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" id="passwordcon" name="passwordcon" required>
            <label for="passwordcon">Confirm Password</label>
        </div>

        <div class="inputbox">
            <ion-icon name="accessibility-outline"></ion-icon>
            <select id="userType" name="userType" required>
                <option value="" disabled selected>Select Role</option>
                <option value="STUDENT">Student</option>
                <option value="TA">Teaching Assistant</option>
                <option value="TEACHER">Teacher</option>
            </select>
        </div>

        <button id="submit" type="submit">Sign Up</button>
        <div class="register">
            <p>Already have an account? <a href="/login">Log In</a></p>
        </div>
    </form>
</section>

<script>
    document.getElementById("signupForm").addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('passwordcon').value;
        const userType = document.getElementById('userType').value;

        console.log("Form values before validation:");
        console.log("Name:", name);
        console.log("Email:", email);
        console.log("Password length:", password ? password.length : 0);
        console.log("Confirm password length:", confirmPassword ? confirmPassword.length : 0);
        console.log("User type:", userType);

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        // Validate all fields are filled
        if (!name || !email || !password || !userType) {
            alert("Please fill in all fields");
            console.error("Missing required field:", {
                name: !name, 
                email: !email, 
                password: !password, 
                userType: !userType
            });
            return;
        }

        const data = {
            name: name,
            email: email,
            password: password,
            userType: userType
        };

        // Debug what's being sent
        const dataCopy = {...data, password: data.password ? '********' : null};
        console.log("Data to be sent:", dataCopy);

        // Get CSRF token
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';

        const headers = {
            'Content-Type': 'application/json'
        };
        
        // Add CSRF token if available
        if (csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        // Prepare JSON string manually to ensure all fields are included
        const jsonData = JSON.stringify({
            name: name,
            email: email,
            password: password,
            userType: userType
        });
        
        console.log("JSON data (password masked):", jsonData.replace(password, "********"));

        // Submit registration directly
        console.log("Proceeding with registration");
        
        fetch('/req/signup', {
            method: 'POST',
            headers: headers,
            body: jsonData
        })
        .then(response => {
            console.log("Response status:", response.status);
            console.log("Response headers:", JSON.stringify([...response.headers]));
            
            // Try to determine content type
            const contentType = response.headers.get('content-type');
            console.log("Content type:", contentType);
            
            if (response.ok) {
                if (contentType && contentType.includes('application/json')) {
                    return response.json().then(data => {
                        console.log("Registration successful:", data);
                        alert("Signup successful! Redirecting to login page.");
                        window.location.href = "/login";
                    });
                } else {
                    return response.text().then(text => {
                        console.log("Non-JSON success response:", text);
                        alert("Signup successful! Redirecting to login page.");
                        window.location.href = "/login";
                    });
                }
            } else {
                return response.text().then(text => {
                    console.error("Registration failed:", text);
                    
                    try {
                        // Try to parse as JSON
                        const jsonError = JSON.parse(text);
                        alert("Signup failed: " + (jsonError.message || JSON.stringify(jsonError)));
                    } catch (e) {
                        // If not JSON, show the text
                        if (text.includes("<!DOCTYPE html>")) {
                            alert("Server error. Please try again later.");
                            console.error("HTML error response received");
                        } else {
                            alert("Signup failed: " + text);
                        }
                    }
                });
            }
        })
        .catch(err => {
            console.error("Error during signup:", err);
            alert("Something went wrong. Try again.");
        });
    });
</script>
</body>
</html>
