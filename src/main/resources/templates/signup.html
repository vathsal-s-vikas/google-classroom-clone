<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classroom - Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF tokens for security -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #3f51b5;
            --primary-dark: #303f9f;
            --secondary: #4CAF50;
            --secondary-dark: #388E3C;
            --text-light: #f8f9fa;
            --text-dark: #212529;
            --background: #f4f6f9;
            --white: #ffffff;
            --gray-light: #f8f9fa;
            --gray: #6c757d;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background-color: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .signup-form {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
        }

        .signup-image {
            flex: 1;
            background-image: url('https://source.unsplash.com/random/600x800/?students');
            background-size: cover;
            background-position: center;
            position: relative;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .signup-image-content {
            position: relative;
            color: var(--white);
            text-align: center;
            padding: 2rem;
            z-index: 1;
        }

        .signup-image-content h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .signup-image-content p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .signup-header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .signup-header p {
            color: var(--gray);
        }

        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            flex: 1;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .input-with-icon input,
        .input-with-icon select {
            padding-left: 2.5rem;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .terms-check input {
            margin-right: 0.5rem;
            margin-top: 0.3rem;
        }

        .terms-check label {
            color: var(--gray);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .terms-check a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .signup-btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .signup-btn:hover {
            background-color: var(--primary-dark);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider::before {
            margin-right: 0.5rem;
        }

        .divider::after {
            margin-left: 0.5rem;
        }

        .social-signup {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
        }

        .google-btn {
            background-color: #f5f5f5;
            color: #757575;
            border: 1px solid #ddd;
        }

        .google-btn:hover {
            background-color: #e8e8e8;
        }

        .login-link {
            text-align: center;
            margin-top: auto;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-to-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .back-to-home:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .signup-container {
                flex-direction: column;
                max-width: 500px;
            }

            .signup-image {
                min-height: 200px;
                order: -1;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .signup-form {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="signup-container">
        <div class="signup-form">
            <div class="signup-header">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Classroom</span>
                </div>
                <p>Create your account</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="passwordcon">Confirm Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="passwordcon" name="passwordcon" required placeholder="••••••••">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="userType">Role</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-tag"></i>
                        <select id="userType" name="userType" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="STUDENT">Student</option>
                            <option value="TA">Teaching Assistant</option>
                            <option value="TEACHER">Teacher</option>
                        </select>
                    </div>
                </div>

                <div class="terms-check">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="signup-btn">Create Account</button>

                <div class="divider">or sign up with</div>

                <div class="social-signup">
                    <a href="/oauth2/authorization/google" class="social-btn google-btn">
                        <i class="fab fa-google"></i> Google
                    </a>
                </div>

                <div class="login-link">
                    Already have an account? <a href="/login">Sign in</a>
                </div>
            </form>
        </div>
        <div class="signup-image">
            <div class="signup-image-content">
                <h2>Join Our Community</h2>
                <p>Sign up today and experience a new way of learning and teaching.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('passwordcon').value;
            const userType = document.getElementById('userType').value;
            const termsAccepted = document.getElementById('terms').checked;

            // Validate terms acceptance
            if (!termsAccepted) {
                alert("Please accept the Terms of Service and Privacy Policy");
                return;
            }

            // Validate passwords match
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            // Validate all fields are filled
            if (!name || !email || !password || !userType) {
                alert("Please fill in all fields");
                return;
            }

            const data = {
                name: name,
                email: email,
                password: password,
                userType: userType
            };

            // Get CSRF token
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';

            const headers = {
                'Content-Type': 'application/json'
            };
            
            // Add CSRF token if available
            if (csrfToken) {
                headers[csrfHeader] = csrfToken;
            }

            fetch('/req/signup', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    alert("Signup successful! Redirecting to login page.");
                    window.location.href = "/login";
                } else {
                    return response.text().then(text => {
                        try {
                            const error = JSON.parse(text);
                            if (typeof error === 'object') {
                                // Handle validation errors
                                let errorMessage = "Please fix the following errors:\n";
                                for (const key in error) {
                                    errorMessage += `- ${error[key]}\n`;
                                }
                                alert(errorMessage);
                            } else {
                                alert(error || "An error occurred during registration");
                            }
                        } catch (e) {
                            alert(text || "An error occurred during registration");
                        }
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("An error occurred. Please try again later.");
            });
        });
    </script>
</body>
</html>
